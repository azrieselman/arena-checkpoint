modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/azrieselman/arena-checkpoint/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/azrieselman/arena-checkpoint"
authors="Ty-Ty"
description='''
When you die during a boss fight, your dropped items are placed where you entered the fight instead of inside the boss. If the Corpse mod is installed, its corpse is placed there too. Corpse is optional.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
